<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과일톡 - AI 과일 분류기</title>

    <!-- Teachable Machine 라이브러리 (정확한 버전으로 명시) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            background: #f4f8f5;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #2e8b57;
            font-size: 36px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .model-box {
            padding: 15px;
            margin-bottom: 25px;
            background: #f0f7f1;
            border-radius: 12px;
            text-align: left;
        }

        .model-box h3 {
            margin-top: 0;
            color: #2e8b57;
        }

        .model-url {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2e8b57;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #246b43;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .model-status {
            margin-top: 12px;
            font-size: 14px;
            color: #777;
            word-break: break-word;
        }

        .ok {
            color: #238b45;
        }

        .error {
            color: #d93025;
        }

        .upload-box {
            padding: 25px;
            margin-bottom: 20px;
            border: 2px dashed #9bc9a8;
            border-radius: 15px;
            background: #fbfefb;
        }

        .upload-box p {
            color: #666;
        }

        input[type="file"] {
            display: block;
            margin: 15px auto 0;
            max-width: 100%;
        }

        .preview-area {
            margin: 20px auto;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 350px;
            border-radius: 12px;
            object-fit: contain;
            margin: auto;
        }

        .analyze-button {
            width: 100%;
            margin-top: 10px;
            font-size: 17px;
            font-weight: bold;
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f0f7f1;
            border-radius: 15px;
            text-align: left;
        }

        .result-box h2 {
            text-align: center;
            color: #2e8b57;
        }

        .result-name {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
            color: #333;
        }

        .prediction {
            margin: 15px 0;
        }

        .prediction-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .bar-background {
            width: 100%;
            height: 15px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: #4caf50;
            border-radius: 20px;
            transition: width 0.4s;
        }

        .status {
            margin-top: 15px;
            color: #777;
            font-size: 14px;
            text-align: center;
            word-break: break-word;
        }

        .reset-button {
            margin-top: 20px;
            background: #777;
        }

        .reset-button:hover {
            background: #555;
        }

        footer {
            margin-top: 30px;
            color: #aaa;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 20px;
                margin: 20px auto;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>과일톡</h1>
        <p class="subtitle">
            AI가 사진을 분석하여 과일을 알려드립니다.
        </p>

        <!-- AI 모델 연결 -->
        <div class="model-box">
            <h3>AI 모델 연결</h3>

            <input
                type="text"
                id="modelUrl"
                class="model-url"
                value="./model/"
                placeholder="모델 폴더 경로"
            >

            <button id="loadBtn" type="button">
                모델 다시 연결
            </button>

            <div id="modelStatus" class="model-status">
                AI 모델을 연결하는 중입니다...
            </div>
        </div>

        <!-- 이미지 업로드 -->
        <div class="upload-box">
            <h3>과일 사진 업로드</h3>

            <p>
                사과, 바나나, 오렌지 사진을 선택해 주세요.
            </p>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >
        </div>

        <!-- 이미지 미리 보기 -->
        <div class="preview-area">
            <img id="preview" alt="업로드한 과일 이미지">
        </div>

        <!-- 분석 버튼 -->
        <button
            id="analyzeBtn"
            class="analyze-button"
            type="button"
            disabled
        >
            과일 분석하기
        </button>

        <!-- 분석 상태 -->
        <div id="status" class="status">
            AI 모델 연결을 기다리고 있습니다.
        </div>

        <!-- 분석 결과 -->
        <div id="resultBox" class="result-box">

            <h2>분석 결과</h2>

            <div id="resultName" class="result-name">
                과일 이름
            </div>

            <p>과일별 예측 확률</p>

            <div id="predictions"></div>

        </div>

        <!-- 초기화 버튼 -->
        <button
            id="resetBtn"
            class="reset-button"
            type="button"
        >
            초기화
        </button>

        <footer>
            AI 과일 분류 프로젝트 | 과일톡
        </footer>

    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        let model = null;
        let selectedFile = null;

        function setModelStatus(message, type = "") {
            $("modelStatus").textContent = message;
            $("modelStatus").className = "model-status " + type;
        }

        function setStatus(message, type = "") {
            $("status").textContent = message;
            $("status").className = "status " + type;
        }

        async function loadModel() {
            const raw = $("modelUrl").value.trim() || "./model/";

            if (!window.tmImage || !window.tf) {
                setModelStatus(
                    "Teachable Machine 라이브러리를 불러오지 못했습니다.",
                    "error"
                );
                setStatus("인터넷 연결을 확인해 주세요.", "error");
                return;
            }

            const baseUrl = raw.endsWith("/") ? raw : raw + "/";

            const modelJsonUrl = new URL("model.json", new URL(baseUrl, window.location.href)).href;
            const metadataUrl = new URL("metadata.json", new URL(baseUrl, window.location.href)).href;

            $("loadBtn").disabled = true;
            setModelStatus("AI 모델 파일을 확인하고 있습니다...");
            setStatus("AI 모델을 연결하고 있습니다...");
            $("analyzeBtn").disabled = true;

            try {
                const loadedModel = await tmImage.load(
                    modelJsonUrl,
                    metadataUrl
                );

                const classCount = loadedModel.getTotalClasses();

                if (classCount < 2) {
                    throw new Error("분류 클래스가 2개 미만입니다. 모델을 확인해 주세요.");
                }

                model = loadedModel;

                setModelStatus(
                    "AI 모델 연결 완료! 총 " + classCount + "개 클래스를 불러왔습니다.",
                    "ok"
                );
                setStatus("사진을 업로드한 후 과일 분석하기를 눌러주세요.", "ok");

                $("analyzeBtn").disabled = !selectedFile;

            } catch (error) {
                model = null;
                $("analyzeBtn").disabled = true;

                setModelStatus("모델 연결 실패: " + error.message, "error");
                setStatus("AI 모델을 연결하지 못했습니다. 폴더 경로와 파일을 확인해 주세요.", "error");
                console.error("AI 모델 연결 오류:", error);

            } finally {
                $("loadBtn").disabled = false;
            }
        }

        $("loadBtn").addEventListener("click", loadModel);

        $("imageInput").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith("image/")) {
                setStatus("이미지 파일만 업로드할 수 있습니다.", "error");
                return;
            }

            selectedFile = file;
            $("resultBox").style.display = "none";

            const reader = new FileReader();
            reader.onload = function(e) {
                $("preview").src = e.target.result;
                $("preview").style.display = "block";

                if (model) {
                    $("analyzeBtn").disabled = false;
                    setStatus("사진이 업로드되었습니다. 분석을 시작할 수 있습니다.");
                } else {
                    $("analyzeBtn").disabled = true;
                    setStatus("이미지는 업로드되었습니다. AI 모델 연결을 기다려 주세요.");
                }
            };
            reader.readAsDataURL(file);
        });

        async function analyzeFruit() {
            if (!model) {
                setStatus("AI 모델이 연결되지 않았습니다.", "error");
                return;
            }

            if (!selectedFile || !$("preview").src) {
                setStatus("먼저 과일 사진을 업로드해 주세요.", "error");
                return;
            }

            $("analyzeBtn").disabled = true;
            setStatus("AI가 과일을 분석하고 있습니다...");
            $("resultBox").style.display = "none";

            try {
                const predictions = await model.predict($("preview"));
                predictions.sort((a, b) => b.probability - a.probability);

                const best = predictions[0];
                $("resultName").textContent = "분석 결과: " + best.className;
                $("predictions").innerHTML = "";

                predictions.forEach(function(item) {
                    const percentage = (item.probability * 100).toFixed(1);
                    const predictionDiv = document.createElement("div");
                    predictionDiv.className = "prediction";

                    predictionDiv.innerHTML = `
                        <div class="prediction-info">
                            <span>${item.className}</span>
                            <span>${percentage}%</span>
                        </div>
                        <div class="bar-background">
                            <div class="bar" style="width: ${percentage}%"></div>
                        </div>
                    `;
                    $("predictions").appendChild(predictionDiv);
                });

                $("resultBox").style.display = "block";
                setStatus("과일 분석이 완료되었습니다.", "ok");

            } catch (error) {
                console.error("과일 분석 오류:", error);
                setStatus("이미지 분석 중 오류가 발생했습니다: " + error.message, "error");
            } finally {
                $("analyzeBtn").disabled = !model || !selectedFile;
            }
        }

        $("analyzeBtn").addEventListener("click", analyzeFruit);

        $("resetBtn").addEventListener("click", function() {
            selectedFile = null;
            $("imageInput").value = "";
            $("preview").src = "";
            $("preview").style.display = "none";
            $("resultBox").style.display = "none";
            $("resultName").textContent = "과일 이름";
            $("predictions").innerHTML = "";
            $("analyzeBtn").disabled = true;

            if (model) {
                setStatus("사진을 업로드한 후 과일 분석하기를 눌러주세요.");
            } else {
                setStatus("AI 모델 연결을 기다리고 있습니다.");
            }
        });

        window.addEventListener("DOMContentLoaded", () => {
            loadModel();
        });
    </script>

</body>
</html>
